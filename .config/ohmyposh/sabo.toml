#:schema https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

version = 2
final_space = false
console_title_template = '{{ .Shell }} in {{ .Folder }}'


# ============================================================
# PALETTE
# ============================================================

[palette]

# Main path
dk_pur   = "#e0b0ff"

# Prompt / Git hierarchy
dk_gray  = "#8b90aa"
grey     = "#bac2de"
lt_gray  = "#cdd6f4"
white    = "#f5f7ff"

# Git ahead / behind
cyan     = "#94e2d5"

# Teleport persona
teleport = "#5fd7ff"


# ============================================================
# MAIN PROMPT
# ============================================================

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true


# ============================================================
# >>> PROMPT PREFIX
# ============================================================

[[blocks.segments]]
type = 'text'
style = 'plain'
foreground = 'p:dk_gray'
background = 'transparent'
template = '>'

[[blocks.segments]]
type = 'text'
style = 'plain'
foreground = 'p:lt_gray'
background = 'transparent'
template = '>'

[[blocks.segments]]
type = 'text'
style = 'plain'
foreground = 'p:white'
background = 'transparent'
template = '> '


# ============================================================
# TELEPORT DEMO IDENTITY
# ============================================================

[[blocks.segments]]
type = 'text'
style = 'plain'
foreground = 'p:teleport'
background = 'transparent'
template = '{{ if env "TELEPORT_DEMO_USER" }}[{{ env "TELEPORT_DEMO_USER" }}] {{ end }}'


# ============================================================
# PATH
# ============================================================

[[blocks.segments]]
type = 'path'
style = 'plain'
background = 'transparent'
foreground = 'p:dk_pur'
template = '<p:grey>(</><p:dk_pur>{{ .Path }}</><p:grey>)</>'

[blocks.segments.properties]
style = 'full'


# ============================================================
# GIT
# ============================================================

[[blocks.segments]]
type = 'git'
style = 'plain'
foreground = 'p:grey'
background = 'transparent'
template = ' {{ .UpstreamIcon }}{{ .HEAD }}{{ if or (.Working.Changed) (.Staging.Changed) }}*{{ end }} <p:cyan>{{ if gt .Behind 0 }}⇣{{ end }}{{ if gt .Ahead 0 }}⇡{{ end }}</>'

[blocks.segments.properties]
branch_icon = ' '
fetch_status = true
fetch_upstream_icon = true


# ============================================================
# RIGHT PROMPT
# ============================================================

[[blocks]]
type = 'rprompt'
overflow = 'hidden'

[[blocks.segments]]
type = 'executiontime'
style = 'plain'
foreground = 'p:lt_gray'
background = 'transparent'
template = '{{ .FormattedMs }}'

[blocks.segments.properties]
threshold = 5000


# ============================================================
# COMMAND PROMPT
# ============================================================

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

[[blocks.segments]]
type = 'text'
style = 'plain'
foreground = 'p:dk_gray'
background = 'transparent'
template = '$ '


# ============================================================
# TRANSIENT PROMPT
# ============================================================

[transient_prompt]
foreground = 'p:dk_gray'
background = 'transparent'
template = '$ '


# ============================================================
# SECONDARY PROMPT
# ============================================================

[secondary_prompt]
foreground = 'p:dk_gray'
background = 'transparent'
template = '>> '
