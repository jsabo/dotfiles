# ============================================================
# HERDR CONFIG
# ~/.config/herdr/config.toml
# ============================================================


# ============================================================
# GENERAL
# ============================================================

# Skip the first-run onboarding screen.
onboarding = false


# ============================================================
# THEME
# ============================================================

[theme]

# Use the host terminal ANSI palette as the base so Herdr feels
# like part of the Ghostty theme rather than a separate app.
name = "terminal"

# Keep manual dark-theme behavior.
auto_switch = false


# ============================================================
# CUSTOM THEME COLORS
# ============================================================

[theme.custom]

# ------------------------------------------------------------
# BACKGROUNDS
# ------------------------------------------------------------

# Let normal Herdr panels inherit Ghostty's terminal background.
panel_bg = "reset"

# Slightly darker sidebar so it reads as a navigation rail.
sidebar_bg = "#1a1b2a"

# Active Space / focused Agent row.
active_row_bg = "#303446"

# Navigate-mode cursor selection.
selection_bg = "#414559"

# General Herdr UI surfaces.
surface0 = "#242738"
surface1 = "#303446"
surface_dim = "#202334"


# ------------------------------------------------------------
# TEXT
# ------------------------------------------------------------

# Primary Herdr text.
text = "#d6def8"

# Workspace names and dimmed labels.
subtext0 = "#c4ccec"

# Muted secondary information.
overlay0 = "#949ab7"

# Brighter secondary information.
overlay1 = "#bac2de"

# Git branches / special labels.
mauve = "#e0b0ff"


# ------------------------------------------------------------
# ACCENTS / STATUS
# ------------------------------------------------------------

# Muted navigation accent.
# Used for active tabs, borders, highlights and navigation UI.
accent = "#7f849c"

# Agent / notification states.
green = "#b0e39f"
yellow = "#f5dca6"
red = "#f093a1"

# Keep semantic blue brighter than the navigation accent.
blue = "#91b4ff"

teal = "#91e0d3"
peach = "#f5a97f"


# ============================================================
# UI
# ============================================================

[ui]

# Match the muted navigation accent used above.
accent = "#7f849c"

# Sidebar width in terminal columns.
sidebar_width = 26
sidebar_min_width = 18
sidebar_max_width = 36

# Start with the sidebar visible.
sidebar_start_collapsed = false

# If collapsed manually, keep the compact icon/label version.
sidebar_collapsed_mode = "compact"

# Herdr mouse UI.
mouse_capture = true

# Copy terminal text automatically when selecting it.
copy_on_select = true

# Let Herdr choose the most appropriate cursor implementation.
host_cursor = "auto"

# Force a redraw when Ghostty regains focus.
redraw_on_focus_gained = true

# Mouse-wheel amount per notch.
mouse_scroll_lines = 3

# Ask before closing an entire workspace.
confirm_close = true

# Ask for names when creating tabs.
prompt_new_tab_name = true

# Don't interrupt workspace creation with a naming dialog.
prompt_new_workspace_name = false


# ============================================================
# PANES
# ============================================================

# Draw dividers between split panes.
pane_borders = "auto"

# Remove the large outside rectangular frame around each pane.
# This gives a cleaner tmux/cmux-style layout.
pane_outer_borders = false

# Hide interactive pane scrollbars.
# Scrolling still works with the mouse wheel / trackpad.
pane_scrollbars = false

# Remove the extra gap between panes so neighboring panes share
# a single clean internal divider.
pane_gaps = false

# Don't add agent labels directly to pane borders.
show_agent_labels_on_pane_borders = false


# ============================================================
# TAB BAR
# ============================================================

# Keep Herdr's tab row at the top.
tab_bar_position = "top"

# Hide the tab bar when there is only one tab.
# It reappears automatically when tab 2 exists.
hide_tab_bar_when_single_tab = true

# Right side of the tab bar. hostname and command resolve on the
# selected machine's server, so on a Beam this shows the Beam's
# hostname and its beam-init service count.
tab_bar_right = [
  { type = "hostname" },
  { type = "command", command = "command -v beamctl >/dev/null && beamctl list 2>/dev/null | grep -c . | sed 's/$/ svc/'", interval_seconds = 10, timeout_seconds = 3 },
  { type = "datetime", format = "%H:%M" },
]

tab_bar_right_separator = " · "


# ============================================================
# WINDOW TITLE
# ============================================================

# Title written to Ghostty.
window_title = "{hostname}: {workspace}"


# ============================================================
# AGENT SIDEBAR
# ============================================================

# Group agents by their Spaces.
agent_panel_sort = "spaces"

# Distinct glyphs per state (blocked, working, idle, done) so the
# state reads by shape as well as colour.
status_indicators = "symbols"


# ============================================================
# SIDEBAR LAYOUT
# ============================================================

[ui.sidebar.agents]

# Keep agent rows compact.
row_gap = 0

# Expanded Agent display:
#   line 1: state glyph, machine (hidden for Local, shown for Beams), workspace, agent
#   line 2: state word (idle / working / blocked / done)
#   line 3: the harness's own name, which herdr-beams reports as a pane token
#           (herdr resolves an unknown token name from the pane's reported
#           tokens, src/ui/sidebar/tokens.rs); the row disappears for an agent
#           that reports nothing, so this is safe for agents started by hand
rows = [
  ["state_icon", { token = "machine", rules = [{ equals = "Local", hide = true }] }, "workspace", "agent"],
  ["state_text"],
  [{ token = "$harness", dim = true }],
]

# Claude Code sets a live terminal title (what it is doing now), which is worth
# more than its name, so its third line shows that instead.
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", { token = "machine", rules = [{ equals = "Local", hide = true }] }, "workspace", "agent"],
  ["state_text"],
  [{ token = "terminal_title_stripped", dim = true }],
]


[ui.sidebar.spaces]

# Keep Space rows tight.
row_gap = 0

# Expanded Space display:
#   line 1: rolled-up agent state glyph, workspace, state word (hidden when no agent)
#   line 2: branch + git status
rows = [
  ["state_icon", "workspace", { token = "state_text", rules = [{ equals = "unknown", hide = true }] }],
  ["branch", "git_status"],
]


# ============================================================
# NOTIFICATIONS
# ============================================================

[ui.toast]

# macOS notifications when a background agent finishes or blocks
# (uses terminal-notifier when installed, osascript otherwise).
delivery = "system"

# Small debounce before a completed/blocked state becomes a notification.
delay_seconds = 1


[ui.toast.herdr]

position = "bottom-right"


[ui.toast.clipboard]

enabled = true
position = "bottom-center"


# ============================================================
# SOUND
# ============================================================

[ui.sound]

enabled = false


# ============================================================
# KEYS
# ============================================================

# Teleport Beams plugin (herdr-beams): all actions open popups.
#
# One rule: the prefix, then Shift and the first letter of the thing.
# B)eam, C)laude, O)penAI, A)gent, S)tatus, L)ogs, E)xpose, K)ill, Q)uit.
#
# From plugin 0.9.0 the same keys work whichever machine is selected, because
# each Beam runs the plugin too: with Local selected they act on any Beam, with
# a Beam selected they act on that Beam. New Beam, delete and delete-all need
# this laptop's Teleport login and the machines rail, so on a Beam they say so
# and change nothing; prefix+g picks Local.
#
# Actions skip y/N confirmations unless BEAMS_YES=0 is set in the plugin's env
# file; workspace labels and prompts are still collected interactively.
#
# Every key avoids a herdr default. A custom command claims its key before the
# defaults are parsed and the colliding default is dropped with no warning
# (src/config/keybinds.rs:651 and :1099-1102), so a collision costs a herdr
# action, silently: prefix+s used to take Settings away, hence Shift+S here.
# Shift+D would be the obvious key for delete and is close-workspace, hence
# Shift+K for kill. prefix+b is the sidebar and prefix+q detaches, hence the
# shifted B and Q. This is the same block as config/beam-keys.toml in the
# plugin, which is what each Beam gets.
# plugin_action bindings name <plugin id>.<action id>.
[[keys.command]]
key = "prefix+shift+b"
type = "plugin_action"
command = "herdr-beams.new"
description = "new Beam (laptop only)"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "herdr-beams.claude"
description = "launch Claude in this Beam"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "herdr-beams.codex"
description = "launch Codex in this Beam"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "herdr-beams.profiles"
description = "choose an agent profile for this Beam"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "herdr-beams.status"
description = "this Beam's status"

[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "herdr-beams.services"
description = "this Beam's services and their logs"

[[keys.command]]
key = "prefix+shift+e"
type = "plugin_action"
command = "herdr-beams.publish"
description = "expose port 8080 of this Beam"

[[keys.command]]
key = "prefix+shift+k"
type = "plugin_action"
command = "herdr-beams.rm"
description = "delete a Beam (laptop only)"

[[keys.command]]
key = "prefix+shift+q"
type = "plugin_action"
command = "herdr-beams.rm-all"
description = "delete every Beam (laptop only)"


# ============================================================
# TERMINAL
# ============================================================

[terminal]

# Empty means use your normal shell.
default_shell = ""

# On macOS Herdr will use a login shell automatically.
shell_mode = "auto"

# New panes follow the source pane/workspace directory.
new_cwd = "follow"

# Keep Kitty-graphics support available for compatible panes.
kitty_graphics = true
